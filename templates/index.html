
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at center, #0a0a0a 0%, #1a1a1a 100%);
      color: #00f6ff;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .jarvis {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }
    .holo {
      width: 320px;
      height: 320px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 246, 255, 0.05);
      border-radius: 50%;
      box-shadow: 0 0 60px 10px #00f6ff44, 0 0 120px 20px #00f6ff22 inset;
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 60px 10px #00f6ff44, 0 0 120px 20px #00f6ff22 inset; }
      100% { box-shadow: 0 0 90px 20px #00f6ff88, 0 0 180px 40px #00f6ff44 inset; }
    }
    .svg-circuit {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .center-dot {
      width: 32px;
      height: 32px;
      background: #00f6ff;
      border-radius: 50%;
      box-shadow: 0 0 40px 10px #00f6ff99;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      border: 2px solid #fff2;
      animation: glow 1.5s infinite alternate;
    }
    @keyframes glow {
      0% { box-shadow: 0 0 40px 10px #00f6ff99; }
      100% { box-shadow: 0 0 60px 20px #00f6ffcc; }
    }
    .status {
      margin-top: 40px;
      letter-spacing: 3px;
      opacity: 0.95;
      font-size: 1.5em;
      text-shadow: 0 0 10px #00f6ff, 0 0 20px #00f6ff88;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      border: 2px solid #00f6ff44;
      border-radius: 8px;
      padding: 10px 32px;
      background: rgba(0,246,255,0.07);
      box-shadow: 0 0 20px 2px #00f6ff22;
    }
    .scan {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 2px dashed #00f6ff88;
      animation: scan 3s linear infinite;
      z-index: 1;
    }
    @keyframes scan {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .bg-lines {
      position: absolute;
      width: 100vw;
      height: 100vh;
      top: 0; left: 0;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-lines">
    <svg width="100vw" height="100vh">
      <line x1="10%" y1="10%" x2="90%" y2="10%" stroke="#00f6ff22" stroke-width="2" />
      <line x1="10%" y1="90%" x2="90%" y2="90%" stroke="#00f6ff22" stroke-width="2" />
      <line x1="10%" y1="10%" x2="10%" y2="90%" stroke="#00f6ff22" stroke-width="2" />
      <line x1="90%" y1="10%" x2="90%" y2="90%" stroke="#00f6ff22" stroke-width="2" />
    </svg>
  </div>
  <div class="jarvis">
    <div class="holo">
      <svg class="svg-circuit" viewBox="0 0 320 320">
        <circle cx="160" cy="160" r="150" stroke="#00f6ff55" stroke-width="2" fill="none" />
        <circle cx="160" cy="160" r="120" stroke="#00f6ff33" stroke-width="2" fill="none" />
        <circle cx="160" cy="160" r="80" stroke="#00f6ff22" stroke-width="2" fill="none" />
        <circle cx="160" cy="160" r="40" stroke="#00f6ff11" stroke-width="2" fill="none" />
        <g>
          <line x1="160" y1="10" x2="160" y2="40" stroke="#00f6ff88" stroke-width="2" />
          <line x1="160" y1="280" x2="160" y2="310" stroke="#00f6ff88" stroke-width="2" />
          <line x1="10" y1="160" x2="40" y2="160" stroke="#00f6ff88" stroke-width="2" />
          <line x1="280" y1="160" x2="310" y2="160" stroke="#00f6ff88" stroke-width="2" />
        </g>
      </svg>
      <div class="center-dot"></div>
      <div class="scan"></div>
    </div>
    <div class="status">SYSTEM ONLINE</div>
  </div>
</body>
</html>
