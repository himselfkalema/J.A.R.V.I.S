

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #181c24 0%, #232b39 100%);
      color: #f6f6f6;
      font-family: 'Orbitron', 'Share Tech Mono', monospace, sans-serif;
      overflow: hidden;
    }
    .city-bg {
      position: absolute;
      width: 100vw;
      height: 100vh;
      left: 0; top: 0;
      z-index: 0;
      background: url('https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=1500&q=80') center/cover no-repeat;
      opacity: 0.08;
      filter: blur(2px);
    }
    .hud {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .center-hud {
      position: relative;
      width: 420px;
      height: 420px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-hud {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(24,28,36,0.7);
      box-shadow: 0 0 60px 10px #00f6ff44, 0 0 120px 20px #ff7b00aa inset;
      border: 4px solid #ff7b00;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s infinite alternate;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 60px 10px #00f6ff44, 0 0 120px 20px #ff7b0044 inset; }
      100% { box-shadow: 0 0 90px 20px #00f6ff88, 0 0 180px 40px #ff7b00cc inset; }
    }
    .circle-inner {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid #00f6ff;
      box-shadow: 0 0 30px 5px #00f6ff55;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
    }
    .center-dot {
      width: 36px;
      height: 36px;
      background: #ff7b00;
      border-radius: 50%;
      box-shadow: 0 0 40px 10px #ff7b00cc;
      border: 2px solid #fff2;
      animation: glow 1.5s infinite alternate;
    }
    @keyframes glow {
      0% { box-shadow: 0 0 40px 10px #ff7b00cc; }
      100% { box-shadow: 0 0 60px 20px #ff7b00ff; }
    }
    .hud-panels {
      display: flex;
      gap: 24px;
      margin-top: 10px;
      z-index: 3;
    }
    .panel {
      background: rgba(24,28,36,0.85);
      border: 2px solid #00f6ff44;
      border-radius: 16px;
      box-shadow: 0 0 12px 2px #00f6ff22;
      padding: 18px 32px;
      min-width: 160px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1em;
      text-align: center;
      letter-spacing: 1.5px;
    }
    .hud-controls {
      display: flex;
      gap: 18px;
      margin-top: 30px;
      z-index: 3;
    }
    .hud-btn {
      background: linear-gradient(90deg, #ff7b00 0%, #ffb347 100%);
      color: #181c24;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 1.1em;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      box-shadow: 0 0 10px #ff7b00aa;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .hud-btn:hover {
      background: linear-gradient(90deg, #00f6ff 0%, #ff7b00 100%);
      color: #fff;
    }
    .status-bar {
      margin-top: 40px;
      letter-spacing: 3px;
      opacity: 0.95;
      font-size: 1.3em;
      text-shadow: 0 0 10px #00f6ff, 0 0 20px #ff7b00;
      font-family: 'Orbitron', 'Share Tech Mono', sans-serif;
      border: 2px solid #00f6ff44;
      border-radius: 8px;
      padding: 10px 32px;
      background: rgba(0,246,255,0.07);
      box-shadow: 0 0 20px 2px #00f6ff22;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="city-bg"></div>
  <div class="hud">
    <div class="center-hud">
      <div class="circle-hud">
        <div class="circle-inner">
          <div class="center-dot"></div>
        </div>
      </div>
    </div>
    <div class="hud-panels">
      <div class="panel">CPU: 23%</div>
      <div class="panel">RAM: 48%</div>
      <div class="panel">DISK: 61%</div>
    </div>
    <div class="hud-controls">
      <button class="hud-btn">Activate</button>
      <button class="hud-btn">Shutdown</button>
      <button class="hud-btn">Settings</button>
    </div>
    <div class="status-bar">SYSTEM ONLINE</div>
  </div>
</body>
</html>
