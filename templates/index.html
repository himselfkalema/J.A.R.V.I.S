<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS Interface</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: #00f6ff;
      font-family: "Segoe UI", sans-serif;
    }
    .jarvis {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
    }
    .circle {
      width: 200px;
      height: 200px;
      border: 3px solid #8de5e8;
      border-radius: 50%;
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .status {
      margin-top: 20px;
      letter-spacing: 2px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="jarvis">
    <div class="circle"></div>
    <div class="status">SYSTEM ONLINE</div>
  </div>
</body>
</html>
